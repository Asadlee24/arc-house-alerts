name: Arc House Auto Check

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes (GitHub Action limit for free)
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Scraper
        run: |
          curl -X GET "https://detect-brown.vercel.app/api/check"
